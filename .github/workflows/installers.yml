# Tests the server, and runs the macOS installer for real on GitHub's Macs.
#
# The macOS job checks what the simulated-Mac tests check, on a real Mac: the bash 3.2 that
# ships with macOS, only macOS's own tools on PATH, uv installed from astral.sh, the Tapir
# downloads and their signatures, the Add-Ons folder in several languages, the Claude
# Desktop, Claude Code and Codex configs, the installed server started the way the AI apps
# start it, running again, piped from curl, and uninstall.
#
# What CI can't cover: a real Archicad (none runs here, so Tapir goes into fake Archicad
# folders and `doctor` finds no instance), and the macOS password prompt (the fake Add-Ons
# folders are writable, so the installer never needs it).
name: Installers

on:
  push:
    # Not tags: the piped install gets the server from refs/heads/<branch>.zip.
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # The install can break without a commit here: it takes the latest uv, the latest PyPI
  # releases of the server's dependencies (not uv.lock) and Tapir's downloads.
  # GitHub runs schedules from the default branch only.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # The Python that install.sh and install.ps1 give users.
          python-version: '3.12'
      - run: uv run --group dev pytest
      - name: Parse the PowerShell installers with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($file in @('install.ps1', 'uninstall.ps1')) {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$null, [ref]$errors)
              if ($errors.Count -gt 0) { $errors; exit 1 }
          }

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck --shell=bash install.sh uninstall.sh

  macos-install:
    name: macOS install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon and Intel.
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show the system
        run: |
          sw_vers
          uname -m
          /bin/bash --version | head -n 1

      - name: Make fake Archicad folders and existing configs
        run: |
          g="$RUNNER_TEMP/Applications/GRAPHISOFT"
          mkdir -p "$g/Archicad 29/Archicad 29.app/Contents" "$g/Archicad 29/Add-Ons" "$g/Archicad 29/Archicad Library 29"
          touch "$g/Archicad 29/Add-Ons/XReadCfg.txt"
          # French Archicad: the Add-Ons folder is called Extensions.
          mkdir -p "$g/Archicad 28/Archicad 28.app" "$g/Archicad 28/Extensions"
          touch "$g/Archicad 28/Extensions/XReadCfg.txt"
          # Russian Archicad: a name with no ASCII letters, found through XReadCfg.txt.
          mkdir -p "$g/Archicad 27/Archicad 27.app" "$g/Archicad 27/Расширения ArchiCAD"
          touch "$g/Archicad 27/Расширения ArchiCAD/XReadCfg.txt"
          # A Tapir that is already there must be left as it is.
          mkdir -p "$g/Archicad 26/Archicad 26.app" "$g/Archicad 26/Add-Ons/Tapir/TapirAddOn_AC26_Mac.bundle/Contents"
          mkdir -p "$g/Archicad 25/Archicad 25.app" "$g/Archicad 25/Add-Ons"
          touch "$g/Archicad 25/Add-Ons/XReadCfg.txt"
          # No Add-Ons folder: the installer prints a bundle to add by hand.
          mkdir -p "$g/Archicad 30/Archicad 30.app"
          # Ignored: a version without a Tapir build, and a folder without the Archicad app.
          mkdir -p "$g/Archicad 24/Archicad 24.app" "$g/Archicad 24/Add-Ons" "$g/Archicad 29 Old/Add-Ons"
          echo "ARCHIBRIDGE_APPLICATIONS=$RUNNER_TEMP/Applications" >> "$GITHUB_ENV"
          echo "G=$g" >> "$GITHUB_ENV"
          # A Claude Desktop config with another server, which must be kept, and a Codex folder.
          desktop="$HOME/Library/Application Support/Claude"
          mkdir -p "$desktop" "$HOME/.codex"
          printf '{"mcpServers": {"other": {"command": "npx", "args": ["-y", "thing"]}}, "preferences": {"menuBarEnabled": false}}\n' > "$desktop/claude_desktop_config.json"
          cp "$desktop/claude_desktop_config.json" "$RUNNER_TEMP/desktop-original.json"
          printf 'model = "o3"\n' > "$HOME/.codex/config.toml"

      - name: Remove the runner's uv, which most Macs don't have
        run: |
          for path in $(type -ap uv) "$HOME/.local/bin/uv" "$HOME/.cargo/bin/uv" /opt/homebrew/bin/uv /usr/local/bin/uv; do
            sudo rm -f "$path"
          done
          if command -v uv; then echo "uv is still on PATH"; exit 1; fi

      - name: Install Claude Code, so the installer registers the server with it
        run: |
          npm install -g @anthropic-ai/claude-code
          # The installer runs with only macOS's own tools on PATH, plus claude and the node it
          # runs on. Not their folder: on the runners it is Homebrew's, with everything in it.
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$(command -v claude)" "$RUNNER_TEMP/bin/claude"
          ln -s "$(command -v node)" "$RUNNER_TEMP/bin/node"
          echo "MACOS_PATH=/usr/bin:/bin:/usr/sbin:/sbin:$RUNNER_TEMP/bin" >> "$GITHUB_ENV"

      - name: Install with /bin/bash and macOS's own tools
        run: env PATH="$MACOS_PATH" /bin/bash install.sh | tee install-1.txt

      - name: Check the install
        run: |
          if grep -F '[XX]' install-1.txt; then exit 1; fi
          grep -F '[OK] Archicad found: 25, 26, 27, 28, 29, 30' install-1.txt
          grep -F '[..] Installing uv from astral.sh' install-1.txt
          # uv compiles a dependency that has no wheel for this Mac. The runners have Xcode, but
          # a new Mac has no compiler, so only ArchiBridge itself may be built.
          grep -E '^ *Built archibridge @ ' install-1.txt
          if grep -E '^ *Built ' install-1.txt | grep -vF ' archibridge @ '; then exit 1; fi
          grep -F '[OK] Tapir is already in Archicad 26: left as it is.' install-1.txt
          grep -F '[!!] The Add-Ons folder of Archicad 30 was not found.' install-1.txt
          for place in "Archicad 25/Add-Ons" "Archicad 27/Расширения ArchiCAD" "Archicad 28/Extensions" "Archicad 29/Add-Ons"; do
            version=${place%%/*}
            version=${version#Archicad }
            bundle="$G/$place/Tapir/TapirAddOn_AC${version}_Mac.bundle"
            test -x "$bundle/Contents/MacOS/TapirAddOn_AC${version}_Mac"
            codesign --verify --deep --strict "$bundle"
          done
          test ! -e "$G/Archicad 26/Add-Ons/Tapir/TapirAddOn_AC26_Mac.bundle/Contents/MacOS"
          test ! -e "$G/Archicad 24/Add-Ons/Tapir"
          test ! -e "$G/Archicad 29 Old/Add-Ons/Tapir"
          manual="$HOME/Library/Application Support/ArchiBridge/Tapir/1.7.3/TapirAddOn_AC30_Mac/TapirAddOn_AC30_Mac.bundle"
          grep -F "$manual" install-1.txt
          codesign --verify --deep --strict "$manual"
          cmp "$HOME/Library/Application Support/Claude/claude_desktop_config.json.archibridge-backup" "$RUNNER_TEMP/desktop-original.json"
          python3 - <<'EOF'
          import json, os
          home = os.path.expanduser('~')
          server = home + '/.local/bin/archibridge'
          desktop = json.load(open(home + '/Library/Application Support/Claude/claude_desktop_config.json'))
          assert desktop['mcpServers']['archicad'] == {'command': server}, desktop
          assert desktop['mcpServers']['other']['args'] == ['-y', 'thing'], desktop
          assert desktop['preferences'] == {'menuBarEnabled': False}, desktop
          code = json.load(open(home + '/.claude.json'))['mcpServers']['archicad']
          assert code['command'] == server, code
          EOF
          if ! command -v codex; then
            grep -F "command = '$HOME/.local/bin/archibridge'" "$HOME/.codex/config.toml"
          fi
          "$HOME/.local/bin/archibridge" --version
          # doctor exits with 1 when no Archicad is ready, which is the case here.
          "$HOME/.local/bin/archibridge" doctor | tee doctor.json || true
          python3 -c "import json; assert json.load(open('doctor.json'))['instances'] == []"
          test -s "$HOME/Library/Logs/archibridge-install.log"

      - name: Start the installed server the way the AI apps do
        # A server that never answers fails here instead of holding the Mac for 30 minutes.
        timeout-minutes: 2
        run: |
          python3 - "$HOME/.local/bin/archibridge" <<'EOF'
          import json, subprocess, sys
          server = subprocess.Popen([sys.argv[1]], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True, encoding='utf-8')
          def send(message):
              server.stdin.write(json.dumps(message) + '\n')
              server.stdin.flush()
          def reply(request_id):
              for line in server.stdout:
                  message = json.loads(line)
                  if message.get('id') == request_id:
                      return message
              raise SystemExit('The server stopped before it answered request %d.' % request_id)
          send({'jsonrpc': '2.0', 'id': 1, 'method': 'initialize', 'params': {'protocolVersion': '2025-06-18', 'capabilities': {}, 'clientInfo': {'name': 'ci', 'version': '1'}}})
          reply(1)
          send({'jsonrpc': '2.0', 'method': 'notifications/initialized'})
          send({'jsonrpc': '2.0', 'id': 2, 'method': 'tools/list'})
          tools = sorted(tool['name'] for tool in reply(2)['result']['tools'])
          print('Tools:', ', '.join(tools))
          assert {'archicad_instances', 'archicad_get_skill', 'archicad_search_commands'} <= set(tools), tools
          # Neither call needs Archicad: they read the skill and the command catalog installed with the server.
          send({'jsonrpc': '2.0', 'id': 3, 'method': 'tools/call', 'params': {'name': 'archicad_get_skill', 'arguments': {}}})
          skill = reply(3)['result']
          assert not skill.get('isError') and 'Archicad' in skill['content'][0]['text'], skill
          send({'jsonrpc': '2.0', 'id': 4, 'method': 'tools/call', 'params': {'name': 'archicad_search_commands', 'arguments': {'query': 'wall'}}})
          search = reply(4)['result']
          assert not search.get('isError'), search
          server.stdin.close()
          server.wait(timeout=30)
          print('Skill: %d characters. Search: answered.' % len(skill['content'][0]['text']))
          EOF

      - name: Run again, with a damaged download in the cache
        run: |
          echo damaged > "$HOME/Library/Application Support/ArchiBridge/Tapir/1.7.3/TapirAddOn_AC29_Mac.zip"
          env PATH="$MACOS_PATH" /bin/bash install.sh | tee install-2.txt
          if grep -F '[XX]' install-2.txt; then exit 1; fi
          grep -F '[OK] uv found:' install-2.txt
          test "$(grep -cF '[..] Downloading' install-2.txt)" = 1
          grep -F '[..] Downloading TapirAddOn_AC29_Mac.zip...' install-2.txt
          for version in 25 26 27 28 29; do
            grep -F "[OK] Tapir is already in Archicad $version: left as it is." install-2.txt
          done
          cmp "$HOME/Library/Application Support/Claude/claude_desktop_config.json.archibridge-backup" "$RUNNER_TEMP/desktop-original.json"
          test "$(grep -c '"archicad"' "$HOME/Library/Application Support/Claude/claude_desktop_config.json")" = 1
          if ! command -v codex; then
            grep -F '[OK] ChatGPT / Codex: already configured.' install-2.txt
            test "$(grep -cF '[mcp_servers.archicad]' "$HOME/.codex/config.toml")" = 1
          fi

      - name: Run piped from curl, as users do
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          ARCHIBRIDGE_REPO: ${{ github.repository }}
          ARCHIBRIDGE_BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$ARCHIBRIDGE_REPO/$COMMIT/install.sh" | env PATH="$MACOS_PATH" /bin/bash | tee install-3.txt
          if grep -F '[XX]' install-3.txt; then exit 1; fi
          grep -F "[..] Installing the ArchiBridge server from https://github.com/$ARCHIBRIDGE_REPO/archive/refs/heads/$ARCHIBRIDGE_BRANCH.zip..." install-3.txt
          grep -F '[OK] ArchiBridge is installed.' install-3.txt

      - name: Leave a Claude Desktop config that is not valid JSON untouched
        run: |
          config="$HOME/Library/Application Support/Claude/claude_desktop_config.json"
          cp "$config" "$RUNNER_TEMP/good.json"
          printf '{ "mcpServers": { "x": 1, } ' > "$config"
          cp "$config" "$RUNNER_TEMP/bad.json"
          env PATH="$MACOS_PATH" /bin/bash install.sh | tee install-4.txt
          if grep -F '[XX]' install-4.txt; then exit 1; fi
          cmp "$config" "$RUNNER_TEMP/bad.json"
          grep -F 'claude_desktop_config.json is not valid JSON, left untouched.' install-4.txt
          cp "$RUNNER_TEMP/good.json" "$config"

      - name: Uninstall
        run: |
          env PATH="$MACOS_PATH" /bin/bash uninstall.sh | tee uninstall-1.txt
          if grep -F '[XX]' uninstall-1.txt; then exit 1; fi
          grep -F '[OK] Claude Code: removed.' uninstall-1.txt
          grep -F '[OK] Claude Desktop: removed from' uninstall-1.txt
          grep -F '[OK] ArchiBridge server: removed.' uninstall-1.txt
          test ! -e "$HOME/.local/bin/archibridge"
          test ! -e "$HOME/Library/Application Support/ArchiBridge"
          python3 - <<'EOF'
          import json, os
          home = os.path.expanduser('~')
          desktop = json.load(open(home + '/Library/Application Support/Claude/claude_desktop_config.json'))
          assert sorted(desktop['mcpServers']) == ['other'], desktop
          assert 'archicad' not in json.load(open(home + '/.claude.json')).get('mcpServers', {})
          EOF
          if ! command -v codex; then
            if grep -F 'archicad' "$HOME/.codex/config.toml"; then exit 1; fi
            grep -F 'model = "o3"' "$HOME/.codex/config.toml"
          fi
          # Tapir stays in Archicad, because other tools can use it.
          test -d "$G/Archicad 29/Add-Ons/Tapir/TapirAddOn_AC29_Mac.bundle"

      - name: Uninstall again, with nothing left to remove
        run: |
          env PATH="$MACOS_PATH" /bin/bash uninstall.sh | tee uninstall-2.txt
          if grep -F '[XX]' uninstall-2.txt; then exit 1; fi

      - name: Refuse to run with sudo
        run: |
          if out=$(sudo /bin/bash install.sh 2>&1); then echo "$out"; echo "The installer ran as root."; exit 1; fi
          echo "$out"
          echo "$out" | grep -F '[XX] This runs as root (sudo).'
          # For the record: whether sudo kept HOME, and so who owns the log now.
          ls -l "$HOME/Library/Logs/archibridge-install.log" || true
