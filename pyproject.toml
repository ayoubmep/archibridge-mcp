[project]
name = "archibridge"
version = "0.1.0"
description = "MCP server that connects Claude and other AI apps to a running Archicad."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ayoub Bakhabba" }]
dependencies = ["mcp>=1.12,<2"]

[project.scripts]
archibridge = "archibridge.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archibridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
